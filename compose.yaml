name: evaluacion-herrera

services:
  agenda:
    build: ./agenda
    container_name: agenda
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  notificaciones:
    build: ./notificaciones
    container_name: notificaciones
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('node:net');const s=net.connect(4000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(1000,()=>process.exit(1));",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  citas:
    build: ./citas
    container_name: citas
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      AGENDA_URL: "http://agenda:3001"
      NOTIFICACIONES_HOST: "notificaciones"
      NOTIFICACIONES_PORT: "4000"
      AGENDA_TIMEOUT_MS: "2000"
      NOTIFICACIONES_TIMEOUT_MS: "1000"
    depends_on:
      agenda:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
